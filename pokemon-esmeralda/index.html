<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <!-- ✏️ CAMBIAR: nombre del juego que aparece en la pestaña del navegador -->
  <title>Pokemon esmeralda</title>

  <style>
    /* 🔒 NO TOCAR: quita márgenes por defecto del navegador */
    body { margin: 0; background: #111; }

    #game {
      width: 100vw;
      height: 100vh;         /* 🔒 respaldo para navegadores viejos que no soportan dvh */
      height: 100dvh;         /* ✏️ se ajusta a la barra del navegador, evita que se corte arriba */

      /* ✏️ centra el juego y sus controles, evita que queden muy separados */
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <!-- 🔒 NO TOCAR: aquí se dibuja el juego -->
  <div id="game"></div>

  <script>
    // 🔒 NO TOCAR: dónde pone el emulador el juego en la página
    EJS_player = '#game';

    // 🔒 NO TOCAR (salvo que tu ROM no se llame "rom.gba")
    EJS_gameUrl = 'rom.gba';

    // ✏️ CAMBIAR SOLO SI NO ES GBA: 'gba', 'nes', 'snes', 'gb', 'gbc', etc.
    EJS_core = 'gba';

    // 🔒 NO TOCAR: siempre apunta al CDN oficial de EmulatorJS
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

    // ✏️ CAMBIAR: nombre del juego que se ve DENTRO del emulador
    EJS_gameName = "Pokemon esmeralda";
  </script>

  <!-- 🔒 NO TOCAR: carga el emulador desde el CDN -->
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
